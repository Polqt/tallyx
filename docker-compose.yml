services:
  postgres:
    image: postgres:16-alpine
    container_name: tallyx_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./tallyx-backend
    container_name: tallyx_backend
    env_file: ./tallyx-backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - '${PORT}:${PORT}'
    volumes:
      - ./tallyx-backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run dev

volumes:
  postgres_data:
